  - {name: Marcus Oyelaran, email: marcus@keyhavenagents.example, phone: "+12025550102"}
  - {name: Priya Natarajan, email: priya@hearthstoneadvisors.example, phone: "+13125550103"}
  - {name: Tomas Ferreira, email: tomas@hearthstoneadvisors.example, phone: "+13125550104"}
  - {name: Grace Albright, email: grace@bluedooragency.example, phone: "+14155550105"}
  - {name: Owen McCarthy, email: owen@bluedooragency.example, phone: "+14155550106"}
  - {name: Lena Kowalski, email: lena@northstarbuyers.example, phone: "+16175550107"}
  - {name: Victor Huang, email: victor@northstarbuyers.example, phone: "+16175550108"}
  - {name: Amara Okafor, email: amara@crestlinerep.example, phone: "+17135550109"}
  - {name: Felix Brandt, email: felix@crestlinerep.example, phone: "+17135550110"}
  - {name: Rosa Delgado, email: rosa@meridianhomeagents.example, phone: "+13055550111"}
  - {name: Henry Lockwood, email: henry@meridianhomeagents.example, phone: "+13055550112"}

sources:
  - slug: inbox
    kind: email
    auth_method: basic
    basic_user: inbox
    # Portal relay addresses: the portal's own sender, shared by every buyer it forwards.
    relay_senders:
      - leads@hearthly.example
      - notify@dwellr.example
      - inquiries@porchlight-listings.example
      - alerts@moveline.example
      - contact@abode-atlas.example
      - leads@gablework.example
      - hello@lattice-lane.example
    spam_senders: [promo-blast.example, seo-rocket.example, prize-center.example, cheap-meds.example]

  - slug: site-form
    kind: form
    auth_method: token
    honeypot_field: website
    # Pages on these origins may post this form from a browser.
    allowed_origins: ["https://www.larkspur.example"]
    field_mapping:
      name: name
      phone: phone
      email: email
      item: listing
      message: message
    spam_senders: [promo-blast.example, seo-rocket.example, prize-center.example, cheap-meds.example]

  - slug: partner-form
    kind: form
    auth_method: hmac
    hmac_secret_env: FIRSTCALL_PARTNER_FORM_SECRET # pragma: allowlist secret (a variable name)
    delivery_id_header: X-Delivery-Id
    field_mapping:
      first_name: contact.first
      last_name: contact.last
      phone: contact.phone
      email: contact.email
      item: interest.listing
      team: interest.team
      message: notes
    spam_senders: [promo-blast.example, seo-rocket.example, prize-center.example, cheap-meds.example]

  - slug: calls
    kind: call
    auth_method: basic
    basic_user: calls
    delivery_id_header: X-Call-Id
    field_mapping:
      name: caller.name
      phone: caller.number
      item: listing
      message: transcript
    # The numbers buyers dial. They belong to the call service, never to a buyer.
    tracking_numbers: ["+18005550120", "+18005550121", "+18005550122", "+18005550123"]
