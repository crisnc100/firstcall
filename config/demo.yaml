# The demo company that `firstcall seed` loads. Every name, address and number is made up.
# Phone numbers use the 555-01xx range, which is reserved for fiction.
org:
  slug: larkspur
  name: Larkspur Realty

business_hours: &hours
  days: [mon, tue, wed, thu, fri, sat]
  open: "09:00"
  close: "18:00"

teams:
  - slug: north
    name: North
    timezone: America/New_York
    business_hours: *hours
    items: [Cedar Point Lofts, Birchwood Commons, Alder Ridge, Foxglove Row, Highmeadow Flats]
  - slug: south
    name: South
    timezone: America/New_York
    business_hours: *hours
    items: [Saltmarsh Terrace, Palmetto Yard, Heron Bay, Live Oak Landing, Sandpiper Court]
  - slug: east
    name: East
    timezone: America/New_York
    business_hours: *hours
    items: [Harborlight Towers, Beacon Square, Quayside Lofts, Tidewater Mews, Lantern Wharf]
  - slug: west
    name: West
    timezone: America/Denver
    business_hours: *hours
    items: [Juniper Mesa, Red Canyon Homes, Sagebrush Ranch, Pinon Heights, Copperleaf]
  - slug: central
    name: Central
    timezone: America/Chicago
    business_hours: *hours
    items: [Prairie Gate, Millstone Park, Union Depot Flats, Bluestem Village, Larkin Square]

# Third parties who write for a buyer. Their contacts are never a buyer's identity.
