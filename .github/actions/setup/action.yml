name: setup
description: Install uv, Node and the locked Python dependencies, from their caches.
inputs:
  ffmpeg:
    description: Also install ffmpeg, which the voice tests run.
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.11"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: web/package-lock.json
    - shell: bash
      run: uv sync --locked
    - if: inputs.ffmpeg == 'true'
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
        fi
        ffmpeg -version | head -1
